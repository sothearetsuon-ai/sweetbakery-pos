name: 24/7 Cloud Automated Daily Telegram Report

on:
  schedule:
    # Cambodian Evening Window (19:20 - 23:35 ICT = 12:20 - 16:35 UTC):
    # Runs at non-zero minutes (:05, :20, :35) to avoid peak GitHub Actions runner queues
    - cron: '20 12 * * *'
    - cron: '5,35 13,14,15,16 * * *'
    # Cambodian Morning Catch-up Window (07:05, 08:35 ICT = 00:05, 01:35 UTC):
    - cron: '5 0 * * *'
    - cron: '35 1 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Date (YYYY-MM-DD, e.g. 2026-10-24, or leave empty for today)'
        required: false
        default: ''
      force_send:
        description: 'Force send report (bypass schedule and deduplication checks)'
        type: boolean
        required: false
        default: true
  repository_dispatch:
    types: [daily_report, send_daily_report]

concurrency:
  group: 'daily-telegram-report'
  cancel-in-progress: false

jobs:
  send-report:
    name: Run Cloud Daily Report Bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Cloud Report Bot
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force_send }}" = "true" ]; then
              EXTRA_FLAGS="$EXTRA_FLAGS --force"
            fi
            if [ -n "${{ inputs.target_date }}" ]; then
              EXTRA_FLAGS="$EXTRA_FLAGS --date=${{ inputs.target_date }}"
            fi
          fi
          node .github/scripts/cloud_daily_report.cjs $EXTRA_FLAGS
