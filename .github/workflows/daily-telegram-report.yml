name: 24/7 Cloud Automated Daily Telegram Report

on:
  schedule:
    # Cambodian Evening Window (18:00 - 23:45 ICT = 11:00 - 16:45 UTC): checks every 15 minutes
    - cron: '*/15 11-16 * * *'
    # Cambodian Morning Window (08:00 - 10:30 ICT = 01:00 - 03:30 UTC): checks every 30 minutes
    - cron: '*/30 1-3 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Date (YYYY-MM-DD, e.g. 2026-10-24, or leave empty for today)'
        required: false
        default: ''
      force_send:
        description: 'Force send report (bypass schedule and deduplication checks)'
        type: boolean
        required: false
        default: true
  repository_dispatch:
    types: [daily_report, send_daily_report]

concurrency:
  group: 'daily-telegram-report'
  cancel-in-progress: false

jobs:
  send-report:
    name: Run Cloud Daily Report Bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Cloud Report Bot
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force_send }}" = "true" ]; then
              EXTRA_FLAGS="$EXTRA_FLAGS --force"
            fi
            if [ -n "${{ inputs.target_date }}" ]; then
              EXTRA_FLAGS="$EXTRA_FLAGS --date=${{ inputs.target_date }}"
            fi
          fi
          node .github/scripts/cloud_daily_report.cjs $EXTRA_FLAGS
