name: 24/7 Cloud Automated Daily Telegram Report

on:
  schedule:
    # Cambodian Evening Window (19:00 - 23:59 ICT = 12:00 - 16:59 UTC):
    # Uses explicit non-round minutes (03, 18, 33, 48) to avoid runner queue delay at round hours (:00)
    # Guaranteed to trigger reliably across all POS closing hours
    - cron: '3,18,33,48 12,13,14,15,16 * * *'
    # Dedicated 20:05 and 21:05 ICT check (13:05 and 14:05 UTC):
    - cron: '5 13,14 * * *'
    # Cambodian Morning Catch-up Window (07:00 - 09:00 ICT = 00:00 - 02:00 UTC):
    - cron: '7,27,47 0,1,2 * * *'
    # Daytime Hourly Sanity Check:
    - cron: '12 3,5,7,9,11 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Date (YYYY-MM-DD, e.g. 2026-10-24, or leave empty for today)'
        required: false
        default: ''
      force_send:
        description: 'Force send report (bypass schedule and deduplication checks)'
        type: boolean
        required: false
        default: true
  repository_dispatch:
    types: [daily_report, send_daily_report]

concurrency:
  group: 'daily-telegram-report'
  cancel-in-progress: false

jobs:
  send-report:
    name: Run Cloud Daily Report Bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Cloud Report Bot
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force_send }}" = "true" ]; then
              EXTRA_FLAGS="$EXTRA_FLAGS --force"
            fi
            if [ -n "${{ inputs.target_date }}" ]; then
              EXTRA_FLAGS="$EXTRA_FLAGS --date=${{ inputs.target_date }}"
            fi
          fi
          node .github/scripts/cloud_daily_report.cjs $EXTRA_FLAGS
