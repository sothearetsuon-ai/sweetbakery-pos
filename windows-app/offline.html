<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>មិនមានការតភ្ជាប់អ៊ីនធឺណិត - SweetBakery POS</title>
  <style>
    body {
      font-family: 'Kantumruy Pro', 'Siemreap', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #fff1f2, #fdf2f8, #fce7f3);
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(244, 114, 182, 0.3);
      border-radius: 24px;
      padding: 40px;
      max-width: 500px;
      box-shadow: 0 20px 30px -10px rgba(225, 29, 72, 0.15);
    }
    .icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 12px;
      color: #be185d;
      font-weight: 700;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #64748b;
      margin-bottom: 28px;
    }
    .btn {
      background: linear-gradient(135deg, #ec4899, #be185d);
      color: white;
      border: none;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(236, 72, 153, 0.35);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(236, 72, 153, 0.45);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎂📶</div>
    <h1>មិនមានការតភ្ជាប់អ៊ីនធឺណិត</h1>
    <p>
      កម្មវិធីកំពុងព្យាយាមភ្ជាប់ទៅកាន់ Cloud Server (sweetbakery-8040d.web.app) ប៉ុន្តែពុំមានសេវាអ៊ីនធឺណិតឡើយ។<br>
      សូមពិនិត្យមើល Wi-Fi ឬអ៊ីនធឺណិតរបស់អ្នក រួចចុចប៊ូតុងខាងក្រោមដើម្បីព្យាយាមម្តងទៀត។
    </p>
    <button class="btn" onclick="retryConnection()">
      🔄 ព្យាយាមភ្ជាប់ឡើងវិញ
    </button>
  </div>

  <script>
    function retryConnection() {
      const btn = document.querySelector('.btn');
      btn.innerText = 'កំពុងតភ្ជាប់...';
      btn.style.opacity = '0.7';
      btn.disabled = true;
      setTimeout(() => {
        window.location.reload();
      }, 500);
    }
  </script>
</body>
</html>
