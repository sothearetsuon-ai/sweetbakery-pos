<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="roseGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="30%" stop-color="#fda4af" />
      <stop offset="70%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="pinkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>

    <!-- Arc Paths for Curved Text -->
    <path id="roseTopTextArc" d="M 85,300 A 215,215 0 0,1 515,300" fill="none" />
    <path id="roseBottomTextArc" d="M 105,300 A 195,195 0 0,0 495,300" fill="none" />
    <path id="roseSubTopArc" d="M 125,300 A 175,175 0 0,1 475,300" fill="none" />
  </defs>

  <!-- Background Circle Badge -->
  <circle cx="300" cy="300" r="290" fill="url(#pinkBg)" stroke="url(#roseGoldGrad)" stroke-width="10" />

  <!-- Scalloped or Dotted Decorative Ring -->
  <circle cx="300" cy="300" r="268" fill="none" stroke="#fb7185" stroke-width="3" stroke-dasharray="6,6" />

  <!-- Inner Solid Rose Ring -->
  <circle cx="300" cy="300" r="255" fill="none" stroke="url(#roseGoldGrad)" stroke-width="2" />

  <!-- Center Decorative Circle Frame -->
  <circle cx="300" cy="300" r="145" fill="#ffffff" stroke="url(#roseGoldGrad)" stroke-width="4" filter="drop-shadow(0 4px 12px rgba(225,29,72,0.15))" />

  <!-- TOP TEXT: ហាងនំខេក និងនំបុ័ង វិជ្ជតា -->
  <text fill="#881337" font-family="'Battambang', 'Khmer OS Battambang', 'Segoe UI', sans-serif" font-weight="900" font-size="28px" letter-spacing="2px">
    <textPath href="#roseTopTextArc" startOffset="50%" text-anchor="middle">
      🌸 ហាងនំខេក និងនំបុ័ង វិជ្ជតា 🌸
    </textPath>
  </text>

  <!-- Subtitle Arc Text: VICHETA BAKERY -->
  <text fill="#e11d48" font-family="'Playfair Display', Georgia, serif" font-weight="800" font-size="19px" letter-spacing="4px">
    <textPath href="#roseSubTopArc" startOffset="50%" text-anchor="middle">
      • SWEET &amp; FRESH EVERYDAY •
    </textPath>
  </text>

  <!-- CENTER ICON: Sweet Birthday Cake -->
  <g transform="translate(300, 290)">
    <!-- Stand -->
    <path d="M -70,55 L 70,55 Q 75,55 75,60 Q 75,65 70,65 L -70,65 Q -75,65 -75,60 Q -75,55 -70,55 Z" fill="url(#roseGoldGrad)" />
    <path d="M -20,65 L -10,85 L 10,85 L 20,65 Z" fill="url(#roseGoldGrad)" />
    <ellipse cx="0" cy="85" rx="35" ry="5" fill="url(#roseGoldGrad)" />

    <!-- Cake Bottom Tier -->
    <rect x="-60" y="5" width="120" height="50" rx="8" fill="#fff1f2" stroke="url(#roseGoldGrad)" stroke-width="2.5" />
    <path d="M -60,5 C -50,18 -40,5 -30,18 C -20,5 -10,18 0,5 C 10,18 20,5 30,18 C 40,5 50,18 60,5 L 60,0 L -60,0 Z" fill="#f43f5e" />

    <!-- Cake Top Tier -->
    <rect x="-42" y="-35" width="84" height="40" rx="6" fill="#ffffff" stroke="url(#roseGoldGrad)" stroke-width="2" />
    <path d="M -42,-35 C -35,-25 -28,-35 -21,-25 C -14,-35 -7,-25 0,-35 C 7,-25 14,-35 21,-25 C 28,-35 35,-25 42,-35 L 42,-38 L -42,-38 Z" fill="#fda4af" />

    <!-- Strawberries on top -->
    <circle cx="-20" cy="-40" r="5" fill="#e11d48" />
    <circle cx="0" cy="-42" r="6" fill="#e11d48" />
    <circle cx="20" cy="-40" r="5" fill="#e11d48" />

    <!-- Candle -->
    <rect x="-3" y="-62" width="6" height="22" rx="2" fill="url(#roseGoldGrad)" />
    <path d="M 0,-76 C 4,-70 5,-66 0,-63 C -5,-66 -4,-70 0,-76 Z" fill="#f59e0b" filter="drop-shadow(0 0 4px #fbbf24)" />
    <circle cx="0" cy="-66" r="2" fill="#ffffff" />
  </g>

  <!-- EST 2026 Ribbon Badge below cake -->
  <g transform="translate(300, 395)">
    <rect x="-65" y="-14" width="130" height="28" rx="14" fill="url(#roseGoldGrad)" filter="drop-shadow(0 2px 4px rgba(225,29,72,0.25))" />
    <text x="0" y="5" font-family="'Playfair Display', 'Battambang', serif" font-size="14px" font-weight="900" fill="#ffffff" letter-spacing="2px" text-anchor="middle">
      EST. 2026
    </text>
  </g>

  <!-- BOTTOM TEXT: 097 289 4536 • 066 528 160 -->
  <text fill="#881337" font-family="'Battambang', 'Segoe UI', sans-serif" font-weight="900" font-size="24px" letter-spacing="1.5px">
    <textPath href="#roseBottomTextArc" startOffset="50%" text-anchor="middle">
      📞 097 289 4536 • 066 528 160
    </textPath>
  </text>
</svg>

