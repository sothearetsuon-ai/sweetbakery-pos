<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SweetBakery YouTube Bridge</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    #yt-player, iframe {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      display: block !important;
    }
  </style>
</head>
<body>
  <div id="yt-player"></div>
  <script>
    let player = null;
    let isReady = false;
    let pendingVideoId = null;

    // Load official YouTube IFrame API
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    const first = document.getElementsByTagName('script')[0];
    first?.parentNode?.insertBefore(tag, first);

    window.onYouTubeIframeAPIReady = function() {
      try {
        player = new YT.Player('yt-player', {
          height: '100%',
          width: '100%',
          host: 'https://www.youtube.com',
          playerVars: {
            autoplay: 1,
            controls: 1,
            modestbranding: 1,
            playsinline: 1,
            rel: 0,
            enablejsapi: 1,
            origin: 'https://sothearetsuon-ai.github.io',
            widget_referrer: 'https://sothearetsuon-ai.github.io/sweetbakery-pos/',
          },
          events: {
            onReady: function(e) {
              isReady = true;
              try {
                window.parent.postMessage({ type: 'sweetbakery-yt', event: 'ready' }, '*');
              } catch(_) {}
              if (pendingVideoId) {
                try {
                  player.loadVideoById({
                    videoId: pendingVideoId,
                    suggestedQuality: 'hd720'
                  });
                  player.playVideo();
                } catch(err) {
                  console.warn('Pending loadVideoById error in bridge:', err);
                }
                pendingVideoId = null;
              }
            },
            onStateChange: function(e) {
              try {
                window.parent.postMessage({ type: 'sweetbakery-yt', event: 'stateChange', state: e.data }, '*');
              } catch(_) {}
            },
            onError: function(e) {
              console.warn('YouTube Bridge Player Error:', e.data);
              try {
                window.parent.postMessage({ type: 'sweetbakery-yt', event: 'error', code: e.data }, '*');
              } catch(_) {}
            }
          }
        });
      } catch(err) {
        console.warn('Failed to init YT.Player in bridge:', err);
      }
    };

    // Handle commands from parent window
    window.addEventListener('message', function(e) {
      const data = e.data;
      if (!data || data.type !== 'sweetbakery-yt-cmd') return;

      if (data.action === 'load') {
        if (player && isReady && typeof player.loadVideoById === 'function') {
          try {
            player.loadVideoById({
              videoId: data.videoId,
              suggestedQuality: 'hd720'
            });
            player.playVideo();
          } catch(err) {
            console.warn('Error loading video in bridge:', err);
            pendingVideoId = data.videoId;
          }
        } else {
          pendingVideoId = data.videoId;
        }
      } else if (data.action === 'play') {
        if (player && typeof player.playVideo === 'function') {
          try { player.playVideo(); } catch(_) {}
        }
      } else if (data.action === 'pause') {
        if (player && typeof player.pauseVideo === 'function') {
          try { player.pauseVideo(); } catch(_) {}
        }
      } else if (data.action === 'stop') {
        if (player && typeof player.stopVideo === 'function') {
          try { player.stopVideo(); } catch(_) {}
        }
      } else if (data.action === 'seek') {
        if (player && typeof player.seekTo === 'function') {
          try { player.seekTo(data.seconds, true); } catch(_) {}
        }
      } else if (data.action === 'setVolume') {
        if (player && typeof player.setVolume === 'function') {
          try { player.setVolume(data.volume); } catch(_) {}
        }
      }
    });

    // High precision ticker reporting progress to parent app
    setInterval(function() {
      if (player && isReady && typeof player.getCurrentTime === 'function') {
        try {
          const currentTime = player.getCurrentTime() || 0;
          const duration = player.getDuration() || 0;
          window.parent.postMessage({
            type: 'sweetbakery-yt',
            event: 'ticker',
            currentTime: currentTime,
            duration: duration
          }, '*');
        } catch(_) {}
      }
    }, 400);
  </script>
</body>
</html>
